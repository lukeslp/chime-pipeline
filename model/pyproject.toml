[project]
name = "localtype-model"
version = "0.1.0"
description = "Training data and pilot next-word models for the LocalType keyboard"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=1.0",
    "datasets>=4.0",
    "pyarrow>=17",
    "numpy>=2",
    "xxhash>=3",
    "mlx>=0.30",
    "pytest>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
